<noscript><main style="font-family:sans-serif;max-width:640px;margin:40px auto;padding:0 20px"><h1>PDCrest: stay calm, grow stronger</h1><p>Twenty rounds of short games that build calm, confidence, and kindness, with Super, your AI mentor. Please turn on JavaScript to use PDCrest.</p></main></noscript>
<script type="text/babel">
const { useEffect, useLayoutEffect, useRef, useState } = React;
const { gsap, ScrollTrigger } = window;
gsap.registerPlugin(ScrollTrigger);
const useIsomorphicLayoutEffect = typeof window !== 'undefined' ? useLayoutEffect : useEffect;
const WIPES = {
  up: 'linear-gradient(to top, #000 calc(var(--ac-wipe) * 140% - 40%), transparent calc(var(--ac-wipe) * 140%))',
  down: 'linear-gradient(to bottom, #000 calc(var(--ac-wipe) * 140% - 40%), transparent calc(var(--ac-wipe) * 140%))',
  left: 'linear-gradient(to left, #000 calc(var(--ac-wipe) * 140% - 40%), transparent calc(var(--ac-wipe) * 140%))',
  right: 'linear-gradient(to right, #000 calc(var(--ac-wipe) * 140% - 40%), transparent calc(var(--ac-wipe) * 140%))',
  center: 'radial-gradient(farthest-corner at 50% 50%, #000 calc(var(--ac-wipe) * 140% - 40%), transparent calc(var(--ac-wipe) * 140%))'
};
const AnimatedContent = ({
  children, container, distance = 100, direction = 'vertical', reverse = false, duration = 0.8,
  ease = 'power3.out', initialOpacity = 0, animateOpacity = true, scale = 1, blur = 0, rotate = 0,
  tilt = 0, wipe = 'none', threshold = 0.1, delay = 0, stagger = 0, staggerFrom = 'start',
  trigger = 'scroll', once = true, scrub = false, disappearAfter = 0, disappearDuration = 0.5,
  disappearEase = 'power3.in', onStart, onComplete, onDisappearanceComplete, className = '', style, ...props
}) => {
  const ref = useRef(null);
  const callbacksRef = useRef({ onStart, onComplete, onDisappearanceComplete });
  callbacksRef.current = { onStart, onComplete, onDisappearanceComplete };
  useIsomorphicLayoutEffect(() => {
    const el = ref.current;
    if (!el) return undefined;
    let scroller = container || document.getElementById('snap-main-container') || null;
    if (typeof scroller === 'string') scroller = document.querySelector(scroller);
    const reduce = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;
    const ctx = gsap.context(() => {
      const targets = stagger > 0 && el.children.length ? Array.from(el.children) : [el];
      const horizontal = direction === 'horizontal';
      const axis = horizontal ? 'x' : 'y';
      const sign = reverse ? -1 : 1;
      const mask = WIPES[wipe];
      gsap.set(el, { visibility: 'visible' });
      if (reduce) { callbacksRef.current.onComplete?.(); return; }
      const from = { [axis]: distance * sign, scale, opacity: animateOpacity ? initialOpacity : 1 };
      const to = { [axis]: 0, scale: 1, opacity: 1, duration, ease };
      if (blur > 0) { from.filter = `blur(${blur}px)`; to.filter = 'blur(0px)'; }
      if (rotate) { from.rotation = rotate * sign; to.rotation = 0; }
      if (tilt) {
        const tiltAxis = horizontal ? 'rotationY' : 'rotationX';
        from[tiltAxis] = horizontal ? -tilt * sign : tilt * sign; to[tiltAxis] = 0;
        from.transformPerspective = 900; to.transformPerspective = 900;
      }
      if (mask) { gsap.set(targets, { maskImage: mask, webkitMaskImage: mask }); from['--ac-wipe'] = 0; to['--ac-wipe'] = 1; }
      if (stagger > 0) to.stagger = { each: stagger, from: staggerFrom };
      const settle = () => { if (scrub) return; gsap.set(targets, { clearProps: mask ? 'filter,transform,maskImage,webkitMaskImage' : 'filter,transform' }); };
      const disappear = () => {
        if (disappearAfter <= 0) return;
        const out = { [axis]: -distance * sign, scale: 0.8, opacity: animateOpacity ? initialOpacity : 0, delay: disappearAfter, duration: disappearDuration, ease: disappearEase, onComplete: () => callbacksRef.current.onDisappearanceComplete?.() };
        if (blur > 0) out.filter = `blur(${blur}px)`;
        if (stagger > 0) out.stagger = { each: stagger, from: staggerFrom };
        gsap.to(targets, out);
      };
      const tl = gsap.timeline({ paused: true, onStart: () => callbacksRef.current.onStart?.(),
        onComplete: () => { callbacksRef.current.onComplete?.(); settle(); if (once && !scrub) disappear(); } });
      tl.fromTo(targets, from, to, scrub ? 0 : Math.max(delay, 0));
      if (trigger === 'mount') { tl.play(); return; }
      const start = `top ${(1 - threshold) * 100}%`;
      if (scrub) {
        ScrollTrigger.create({ trigger: el, scroller, start, end: `top ${Math.max((1 - threshold) * 100 - 45, 5)}%`, scrub: scrub === true ? true : Math.max(Number(scrub) || 0, 0.01), animation: tl });
        return;
      }
      ScrollTrigger.create({ trigger: el, scroller, start, once, onEnter: () => tl.play(),
        onLeaveBack: once ? undefined : () => { if (mask) gsap.set(targets, { maskImage: mask, webkitMaskImage: mask }); tl.reverse(); } });
    }, el);
    return () => ctx.revert();
  }, [container, distance, direction, reverse, duration, ease, initialOpacity, animateOpacity, scale, blur, rotate, tilt, wipe, threshold, delay, stagger, staggerFrom, trigger, once, scrub, disappearAfter, disappearDuration, disappearEase]);
  return (<div ref={ref} className={className} style={{ visibility: 'hidden', ...style }} {...props}>{children}</div>);
};

/* ---------- Round data: 20 rounds x 6 topics x 3 games ---------- */
const NAMES = ['Know yourself','Name your feelings','Pause and breathe','Understand anger','Calm thinking','Self-confidence','Assertive speech','Listening','Empathy','Handling criticism','Handling conflict','Habits and routine','Stress and sleep','Resilience','Responsibility','Respect and manners','Teamwork','Leadership','Gratitude and positivity','Your personality plan'];
const TIPS = ['Notice what you feel before you act','Put a word to the feeling','Pause for ten seconds before you reply','Spot your early warning signs','Question the first thought','Celebrate small wins','Say what you need using I-statements','Listen fully before you reply','Imagine the other person’s side','Ask what you can learn','Cool down first, then talk','Repeat small healthy habits daily','Protect your sleep and rest','Treat setbacks as practice','Own the mistake and fix it','Show respect even when upset','Share credit and help others','Stay calm and lead by example','Write down three good things','Choose one habit to keep growing'];
const PRACT = ['Write down how you feel right now','Name your feeling in one word','Take five slow breaths','Note one body sign of anger today','Rewrite one harsh thought kindly','Do one thing you are proud of','Say one I-statement to someone','Listen to someone for two minutes without interrupting','Ask someone about their day and truly listen','Thank someone for honest feedback','Step away for a minute during a disagreement','Do your chosen habit for ten minutes','Go to bed fifteen minutes earlier','Write what a setback taught you','Own up to one small mistake','Greet someone warmly','Credit a teammate out loud','Help someone without being asked','Write three things you are grateful for','Write one promise to your future self'];
const TOPICS = [
['Self-awareness','Personal values','Strengths','Weaknesses','Habits you repeat','Blind spots'],
['Feeling words','Anger vs hurt','Fear and worry','Joy and pride','Mixed emotions','Mood check-ins'],
['Ten-second pause','Slow breathing','Body signals','Counting back','Stepping away','Calm spaces'],
['Your triggers','Warning signs','Anger myths','Anger and stress','Anger and sleep','After an outburst'],
['Spotting assumptions','Reframing','Worst-case thoughts','Fair judgments','Self-talk','Letting go'],
['Self-worth','Small wins','Handling mistakes','Positive self-talk','Body language','Comparing less'],
['I-statements','Saying no','Asking for help','Tone of voice','Clear requests','Setting boundaries'],
['Active listening','Not interrupting','Asking questions','Reading cues','Paraphrasing','Patience'],
['Other viewpoints','Kindness','Reading emotions','Giving support','Avoiding judgment','Forgiveness'],
['Receiving feedback','Not defending','Learning from critics','Separating self from work','Giving feedback','Staying humble'],
['Calm disagreement','Common ground','Apologising well','Cooling down first','Family conflict','Workplace conflict'],
['Morning routine','Daily planning','Exercise','Screen time','Healthy eating','Consistency'],
['Stress sources','Sleep habits','Relaxation','Time pressure','Work-life balance','Asking for rest'],
['Bouncing back','Handling failure','Staying patient','Facing fear','Growth mindset','Seeking support'],
['Owning mistakes','Keeping promises','Being on time','Honesty','Self-discipline','Making amends'],
['Greeting well','Public behaviour','Road courtesy','Online etiquette','Respecting elders','Respecting differences'],
['Sharing credit','Cooperation','Trust','Team communication','Handling disagreement','Supporting others'],
['Leading by example','Decision-making','Motivating others','Calm under pressure','Delegating','Taking feedback'],
['Thankfulness','Optimism','Celebrating others','Joy in routine','Kind words','Letting go of grudges'],
['Review your growth','Top strengths','Habits to keep','Goals ahead','Support network','Promise to yourself']];
const ROUNDS = NAMES.map((n, i) => ({ n, tip: TIPS[i], pr: PRACT[i], t: TOPICS[i] }));
const GAMES = ['Quiz (10 questions)', 'Real-life scenarios (3)', 'Practice (2 tasks)'];
const XPG = [20, 15, 15];
const key = (r, t, g) => `${r}.${t}.${g}`;
const roundDone = (s, r) => s.skipped[r] || ROUNDS[r].t.every((_, t) => [0, 1, 2].every(g => s.done[key(r, t, g)]));
const doneCount = (s, r) => ROUNDS[r].t.reduce((a, _, t) => a + [0, 1, 2].filter(g => s.done[key(r, t, g)]).length, 0);
const isPro = s => Date.now() < s.proUntil;
const freeOk = (s, r) => isPro(s) || (r < 3 && (!s.start || Date.now() < s.start + 12 * 36e5));
const unlocked = (s, r) => freeOk(s, r) && (r === 0 || roundDone(s, r - 1));

/* ---------- Festival discount: 12%, active for at most 15 days ---------- */
const FEST = [['Diwali', '2026-11-08'], ['Christmas', '2026-12-25'], ['Makar Sankranti', '2027-01-14'], ['Holi', '2027-03-22']];
const BASE = 1500, OFF = 0.12, DAY = 864e5;
const festStatus = () => {
  const now = Date.now();
  for (const [n, d] of FEST) { const st = new Date(d + 'T00:00:00').getTime(), en = st + 15 * DAY; if (now >= st && now < en) return { on: true, n, left: Math.ceil((en - now) / DAY) }; }
  const nx = FEST.map(([n, d]) => [n, new Date(d + 'T00:00:00').getTime()]).find(([, st]) => st > now);
  return nx ? { on: false, n: nx[0], in: Math.ceil((nx[1] - now) / DAY) } : { on: false };
};
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');

const FRESH = { xp: 0, gems: 0, streak: 0, last: '', done: {}, skipped: {}, chests: 0, proUntil: 0, user: null, keys: [] };

    <section className="sec" style={{ borderTop: 0 }}><div className="wrap">

        <div><b>{ROUNDS.length * 6}</b><span className="muted">topics</span></div>
        <div><b>{ROUNDS.length * 18}</b><span className="muted">games</span></div>

    <section className="sec"><div className="wrap">

        <div><h3 className="brush">Play your way up</h3><p className="muted">Finish a round to unlock the next. Each topic has a quiz, real-life scenarios, and practice tasks.</p></div>
        <div><h3 className="brush">Super, your AI mentor</h3><p className="muted">Ask for advice, rehearse a hard conversation, or talk through a rough day.</p></div>
        <div><h3 className="brush">Rewards that matter</h3><p className="muted">Earn XP, gems, and streaks. Each finished round lets you pick Pro for 6 days or a round skip.</p></div>
      </AnimatedContent>
    </div></section>
    <section className="sec" ref={vid}><div className="wrap">
      <AnimatedContent distance={40}><h2 className="brush">See it in action</h2></AnimatedContent>

    const q = v.trim(); if (!q || busy) return; setV(''); setBusy(true);

    try {
      if (API) {
        const r = await fetch(API + '/api/mentor', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: hist.map(x => ({ role: x.r === 'u' ? 'user' : 'model', text: x.t })) }) });

        const out = await sample(prompt, { cache: false, onText: ({ text }) => setM([...hist, { r: 's', t: text }]) });
        setM([...hist, { r: 's', t: out.text }]);
      }
    } catch (e) { setM([...hist, { r: 's', t: 'I can’t reach my brain right now. Try again in a moment. Meanwhile, take five slow breaths.' }]); }

  };
  return (<div className="wrap sec" style={{ borderTop: 0, maxWidth: 720 }}>

const Responses = () => {
  const [st, setSt] = useState('load'), [rows, setRows] = useState([]);
  useEffect(() => { let off; (async () => { try { const u = await claude.use('user'), db = await claude.use('db'); if (!u || !db || !(await u.isOwner())) return setSt('no');
    setSt('ok'); off = db.collection('responses').onSnapshot(q => setRows(q.docs.map(d => d.data())), () => setSt('no')); } catch (e) { setSt('no'); } })(); return () => off && off(); }, []);
  if (st !== 'ok') return <div className="wrap sec"><p className="muted">{st === 'load' ? 'Loading…' : 'This page is only available to the site owner.'}</p></div>;
  const n = rows.length, avg = n ? rows.reduce((a, r) => a + r.rating, 0) / n : 0;
  return (<div className="wrap sec" style={{ borderTop: 0, maxWidth: 720 }}>
    <h2 className="brush">Customer Responses</h2><p className="muted">{n} response{n === 1 ? '' : 's'} · average {avg.toFixed(1)} out of 5</p>
    {[5, 4, 3, 2, 1].map(k => { const c = rows.filter(r => r.rating === k).length; return <div key={k} className="small">{k} stars: {c}<div className="bar"><i style={{ width: (n ? c / n * 100 : 0) + '%' }} /></div></div>; })}
    <h3 className="brush" style={{ marginTop: 20 }}>Recent comments</h3>
    {rows.filter(r => r.text).sort((a, b) => b.at - a.at).slice(0, 10).map((r, i) => <div className="card" key={i} style={{ marginBottom: 8 }}>{r.rating}/5: {r.text}</div>)}
  </div>);
};

/* ---------- App shell ---------- */
const App = () => {
  const [s, setS] = useState(load), [h, setH] = useState(location.hash.slice(1) || 'home'), [own, setOwn] = useState(false), [tt, setTt] = useState('');
  useEffect(() => { const f = () => { setH(location.hash.slice(1) || 'home'); window.scrollTo(0, 0); }; addEventListener('hashchange', f); return () => removeEventListener('hashchange', f); }, []);
  useEffect(() => { (async () => { try { const u = await claude.use('user'); setOwn(u ? await u.isOwner() : false); } catch (e) {} })(); }, []);
  const [dark, setDark] = useState(() => { try { const t = localStorage.getItem('pdc-theme'); if (t) return t === 'dark'; } catch (e) {} return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); });
  useEffect(() => { document.documentElement.dataset.theme = dark ? 'dark' : 'light'; }, [dark]);
  useEffect(() => { document.body.style.background = h === 'home' ? '#2A0912' : ''; }, [h]);
  const flip = () => { const n = !dark; setDark(n); try { localStorage.setItem('pdc-theme', n ? 'dark' : 'light'); } catch (e) {} };
  const toast = m => { setTt(m); setTimeout(() => setTt(''), 2600); };
  const upd = f => setS(p => { const n = f({ ...p }); save(n); return n; });
  const award = (r, t, g) => { upd(p => {
    if (p.done[key(r, t, g)]) return p;
    p.done = { ...p.done, [key(r, t, g)]: 1 }; p.xp += XPG[g]; p.gems += 2; if (!p.start) p.start = Date.now();
    const td = dayStr(new Date()), y = dayStr(new Date(Date.now() - DAY));
    if (p.last !== td) { p.streak = p.last === y ? p.streak + 1 : 1; p.last = td; }
    if (!p.skipped[r] && roundDone(p, r) && !p.rc?.[r]) { p.rc = { ...p.rc, [r]: 1 }; p.chests++; p.gems += 20; setTimeout(() => toast('Round complete! Choose a reward'), 0); } else setTimeout(() => toast('+' + XPG[g] + ' XP'), 0);
    return p; }); };
  const m = h.match(/^round-(\d+)$/), ri = m ? +m[1] - 1 : -1;
  const page = h === 'rounds' ? <Rounds s={s} /> : ri >= 0 && ri < 20 ? <Round key={h} r={ri} s={s} award={award} toast={toast} /> : h === 'super' ? <Super /> : h === 'rewards' ? <Rewards s={s} upd={upd} toast={toast} /> : h === 'pricing' ? <Pricing s={s} /> : h === 'account' ? <Account s={s} upd={upd} toast={toast} /> : h === 'responses' ? <Responses /> : <Dash s={s} />;
  const L = [['dashboard', 'Dashboard'], ['rounds', 'Rounds'], ['super', 'Super'], ['rewards', 'Rewards'], ['pricing', 'Pricing'], ['account', 'Account']].concat(own ? [['responses', 'Customer Responses']] : []).concat([['home', 'Website']]);
  if (h === 'home') return <Landing />;
  return (<>
    <header><div className="wrap"><a className="logo" href="#dashboard" aria-label="PDCrest dashboard"><Mark size={48} /><span className="brush">PDCrest</span></a>
      <nav aria-label="Main">{L.map(([k, n]) => <a key={k} href={'#' + k} className={h === k || (k === 'rounds' && ri >= 0) ? 'on' : ''}>{n}</a>)}<button className="btn g" aria-pressed={dark} onClick={flip}>{dark ? 'Dark mode: on' : 'Dark mode: off'}</button></nav></div></header>
    <div className="stats"><div className="wrap"><span className="pill">XP <b>{s.xp}</b></span><span className="pill">Streak <b>{s.streak}</b></span><span className="pill">Gems <b>{s.gems}</b></span><span className="pill">Chests <b>{s.chests}</b></span>{Date.now() < s.proUntil && <span className="pill"><b>Pro active</b></span>}</div></div>
    <main key={h}>{page}</main>
    <footer><div className="wrap">PDCrest offers general guidance and is not a substitute for medical or psychological advice. Progress is saved in this browser.</div></footer>
    {tt && <div className="toast" role="status">{tt}</div>}
  </>);
};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body>
</html>
